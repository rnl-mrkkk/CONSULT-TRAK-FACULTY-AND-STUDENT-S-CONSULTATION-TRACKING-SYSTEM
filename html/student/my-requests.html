<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests | CONSULT-TRAK</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/student.css">
</head>
<body data-role="student">
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-user">
                <div class="user-info">
                    <div class="role">Jenny Panther</div>
                    <div class="dept">Student</div>
                </div>
                <button class="notification-bell" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="badge">3</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="label" id="themeLabel">Light</span>
                    <div class="switch"><div class="knob"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">JP</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Jenny Panther</span>
                    <span class="sidebar-user-dept">Student</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="faculty-availability.html" class="nav-item" data-page="faculty-availability">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></span>
                    <span class="nav-label">Faculty Availability</span>
                </a>
                <a href="my-requests.html" class="nav-item" data-page="my-requests">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
                    <span class="nav-label">My Requests</span>
                </a>
                <a href="appointments.html" class="nav-item" data-page="appointments">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
                    <span class="nav-label">Appointments</span>
                </a>
                <a href="history.html" class="nav-item" data-page="history">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v6h6"/><path d="M3.51 9a9 9 0 1 0 2.13-5.36"/><path d="M12 7v5l3 2"/></svg></span>
                    <span class="nav-label">History</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">My Consultation Requests</h2>
                <p class="page-subtitle">Submit a consultation request and track its status (FR-003)</p>
            </div>

            <!-- My Requests List -->
            <div class="content-card request-form" style="margin-bottom: var(--space-lg);">
                <div class="card-header">
                    <h3 class="card-title">My Requests</h3>
                    <span class="stat-label" id="requestCount"></span>
                </div>
                <div class="card-body">
                    <div style="display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-md);">
                        <label class="form-label filter-label" style="margin: 0;">Filter by Status:</label>
                        <select id="statusFilter" class="form-select" style="max-width: 240px; margin: 0;" onchange="renderMyRequests()">
                            <option value="all" selected>All</option>
                            <option value="pending">Pending</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="completed">Completed</option>
                            <option value="rejected">Rejected</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div id="myRequestsList">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>

            <div class="content-card request-form">
                <div class="card-header">
                    <h3 class="card-title">New Request</h3>
                </div>
                <div class="card-body">
                    <div id="formError" class="alert alert-error" style="display: none; margin-bottom: var(--space-md);" role="alert"></div>
                    <div class="form-group">
                        <label class="form-label">Select Department</label>
                        <select id="reqDepartment" class="form-select" onchange="onDepartmentChange()">
                            <option value="">Select a department</option>
                            <option value="SOCS">SOCS Faculty</option>
                            <option value="SBM">SBM Faculty</option>
                            <option value="SON">SON Department</option>
                        </select>
                    </div>
                    <div class="form-group" id="facultyGroup" style="display: none;">
                        <label class="form-label">Select Faculty Member</label>
                        <select id="reqFaculty" class="form-select" onchange="onFacultyChange()">
                            <option value="">Select a faculty member</option>
                        </select>
                        <p id="sonNotice" style="display: none; margin-top: var(--space-xs); font-size: var(--font-size-sm); color: var(--color-text-tertiary);">
                            No faculty members available in this department yet.
                        </p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Concern / Topic</label>
                        <select id="reqSubject" class="form-select">
                            <option value="">Select a concern or topic</option>
                            <option value="Grades">Grades</option>
                            <option value="Academic Performance">Academic Performance</option>
                            <option value="Course/Subject Requirements">Course/Subject Requirements</option>
                            <option value="Thesis / Capstone Advising">Thesis / Capstone Advising</option>
                            <option value="Registration Concern">Registration Concern</option>
                            <option value="Attendance Concern">Attendance Concern</option>
                            <option value="OJT / Internship Concern">OJT / Internship Concern</option>
                            <option value="Recommendation Letter Request">Recommendation Letter Request</option>
                            <option value="Personal / Behavioral Concern">Personal / Behavioral Concern</option>
                            <option value="Others">Others (please specify)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Describe your concern <span class="optional-text">(optional)</span></label>
                        <textarea id="reqConcern" class="form-textarea" placeholder="Explain what you'd like to discuss..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Preferred Date</label>
                            <input type="date" id="reqDate" class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Preferred Time</label>
                            <select id="reqTime" class="form-select" disabled>
                                <option value="">Select a faculty member first</option>
                            </select>
                        </div>
                    </div>
                    <p class="form-hint" id="availabilityHint"></p>
                    <button class="action-btn primary" onclick="submitRequest()">Submit Request</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/student.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        function formatTime(t) {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h)) return t;
            const period = h >= 12 ? 'PM' : 'AM';
            const hour = ((h + 11) % 12) + 1;
            return `${hour}:${m.toString().padStart(2, '0')} ${period}`;
        }

        function onDepartmentChange() {
            const deptSelect = document.getElementById('reqDepartment');
            const facultySelect = document.getElementById('reqFaculty');
            const facultyGroup = document.getElementById('facultyGroup');
            const sonNotice = document.getElementById('sonNotice');
            const selectedDept = deptSelect.value;

            // Reset faculty select
            facultySelect.innerHTML = '<option value="">Select a faculty member</option>';
            sonNotice.style.display = 'none';

            if (!selectedDept) {
                facultyGroup.style.display = 'none';
                return;
            }

            // Show faculty group
            facultyGroup.style.display = 'block';

            // Get faculty for selected department
            const allFaculty = window.studentFunctions.getAllFaculty();
            const deptFaculty = allFaculty.filter(f => f.department === selectedDept);

            if (deptFaculty.length === 0) {
                // Show empty state for SON
                sonNotice.style.display = 'block';
                facultySelect.disabled = true;
            } else {
                facultySelect.disabled = false;
                // Get unique faculty names
                const uniqueFaculty = [...new Set(deptFaculty.map(f => f.displayName))];
                const options = uniqueFaculty.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
                facultySelect.innerHTML = '<option value="">Select a faculty member</option>' + options;
            }
        }

        function populateFaculty() {
            // Faculty is now populated via department selection
            // This function is kept for backwards compatibility
        }

        function statusBadgeText(status) {
            if (status === 'scheduled') return 'Accepted';
            return status.charAt(0).toUpperCase() + status.slice(1);
        }

        function renderMyRequests() {
            const list = document.getElementById('myRequestsList');
            const filter = document.getElementById('statusFilter').value;
            const all = window.studentFunctions.getMyRequests();
            const filtered = filter === 'all' ? all : all.filter(r => r.status === filter);

            document.getElementById('requestCount').textContent = filtered.length + ' request(s)';

            if (filtered.length === 0) {
                const label = filter === 'all' ? 'requests' : filter + ' requests';
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${window.ctIcon('note', 40)}</div>
                        <div class="empty-state-title">No ${escapeHtml(label)}</div>
                        <div class="empty-state-text">Submit a consultation request below to get started.</div>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(r => `
                <div class="appointment-card ${escapeHtml(r.status)}">
                    <div class="appointment-header">
                        <div class="appointment-faculty">${escapeHtml(r.faculty)}</div>
                        <span class="status-badge ${escapeHtml(r.status)}">${escapeHtml(statusBadgeText(r.status))}</span>
                    </div>
                    <div class="appointment-details">
                        <span class="meta-icon">${window.ctIcon('note', 14)} <strong>Subject:</strong> ${escapeHtml(r.subject)}</span>
                        <span class="meta-icon">${window.ctIcon('calendar', 14)} ${escapeHtml(r.preferredDate)}</span>
                        <span class="meta-icon">${window.ctIcon('clock', 14)} ${escapeHtml(r.preferredTime)}</span>
                        ${r.scheduledDate && (r.status === 'scheduled' || r.status === 'completed') ? `<span class="meta-icon">${window.ctIcon('check', 14)} <strong>Confirmed:</strong> ${escapeHtml(r.scheduledDate)} at ${escapeHtml(r.scheduledTime)}</span>` : ''}
                        ${r.venue ? `<span class="meta-icon">${window.ctIcon('pin', 14)} ${escapeHtml(r.venue)}</span>` : ''}
                    </div>
                    ${r.concern ? `<div class="request-concern">"${escapeHtml(r.concern)}"</div>` : ''}
                    ${r.status === 'rejected' && r.rejectionReason ? `
                        <div style="margin-top: var(--space-sm); font-size: var(--font-size-xs); color: var(--color-error);">
                            <strong>Rejection Reason:</strong> ${escapeHtml(r.rejectionReason)}
                        </div>
                    ` : ''}
                    ${(r.status === 'pending' || r.status === 'scheduled') ? `
                        <div style="margin-top: var(--space-md);">
                            <button class="action-btn danger sm" onclick="cancelMyRequest(${r.id})">Cancel Request</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function cancelMyRequest(id) {
            if (!confirm('Cancel this consultation request?')) return;
            if (window.studentFunctions.cancelRequest(id)) {
                renderMyRequests();
            }
        }

        function submitRequest() {
            const faculty = document.getElementById('reqFaculty').value;
            const subject = document.getElementById('reqSubject').value.trim();
            const concern = document.getElementById('reqConcern').value.trim();
            const date = document.getElementById('reqDate').value;
            const time = document.getElementById('reqTime').value;

            if (!faculty) { alert('Please select a faculty member.'); return; }
            if (!subject) { alert('Please enter a concern or topic.'); return; }
            if (!concern) { alert('Please describe your concern.'); return; }
            if (!date) { alert('Please choose a preferred date.'); return; }
            if (!time) { showFormError('Please pick one of the available time slots for this faculty member.'); return; }

            const newId = window.studentFunctions.submitRequest({
                faculty,
                subject,
                concern,
                preferredDate: date,
                preferredTime: formatTime(time),
                status: 'pending'
            });

            // FR6: the data layer returns { error } when a booking would conflict
            if (newId && newId.error) {
                showFormError(newId.error);
                return;
            }

            if (!newId) { alert('Could not submit your request. Please try again.'); return; }

            // Reset the form, then reveal the new pending request in the list
            document.getElementById('reqSubject').value = '';
            document.getElementById('reqConcern').value = '';
            document.getElementById('reqDate').value = '';
            document.getElementById('reqTime').value = '';
            document.getElementById('statusFilter').value = 'pending';
            clearFormError();
            renderMyRequests();
            alert('Consultation request submitted successfully! You can track its status above.');
        }

        function showFormError(message) {
            const box = document.getElementById('formError');
            box.textContent = message;
            box.style.display = 'block';
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearFormError() {
            const box = document.getElementById('formError');
            box.textContent = '';
            box.style.display = 'none';
        }

        /**
         * FR5: offer only the times the selected faculty actually published.
         * Called when the faculty selection changes.
         */
        function onFacultyChange() {
            const faculty = document.getElementById('reqFaculty').value;
            const timeSelect = document.getElementById('reqTime');
            const hint = document.getElementById('availabilityHint');

            if (!faculty) {
                timeSelect.innerHTML = '<option value="">Select a faculty member first</option>';
                timeSelect.disabled = true;
                hint.textContent = '';
                return;
            }

            const windows = window.studentFunctions.getBookableSlots(faculty);
            if (windows.length === 0) {
                timeSelect.innerHTML = '<option value="">No available times</option>';
                timeSelect.disabled = true;
                hint.textContent = faculty + ' has no open slots right now. Please pick another faculty member.';
                return;
            }

            const byDate = {};
            windows.forEach(w => {
                if (!byDate[w.date]) byDate[w.date] = [];
                byDate[w.date].push(w);
            });

            const dates = Object.keys(byDate).sort();
            const options = [];
            dates.forEach(date => {
                const parts = date.split('-');
                const label = new Date(+parts[0], +parts[1] - 1, +parts[2])
                    .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                options.push(`<optgroup label="${escapeHtml(label)}">`);
                byDate[date].forEach(w => {
                    options.push(`<option value="${escapeHtml(w.time)}" data-date="${escapeHtml(date)}">${escapeHtml(w.time)}${w.remaining ? ` &middot; ${w.remaining} left` : ''}</option>`);
                });
                options.push('</optgroup>');
            });

            timeSelect.innerHTML = '<option value="">Select an available time</option>' + options.join('');
            timeSelect.disabled = false;

            // The preferred date must match the chosen time
            const totalDays = dates.length;
            hint.textContent = `${faculty} has ${totalDays} date(s) with open times. Pick a time, then confirm the date.`;
            syncDateToTime();
        }

        /**
         * The time dropdown is grouped by date, so keep the date field in step
         * with whichever time the student picked.
         *
         * The ISO date travels on the option as `data-date` so this works in
         * every browser locale. Parsing the group label would break on any
         * non-English date format.
         */
        function syncDateToTime() {
            const timeSelect = document.getElementById('reqTime');
            const dateInput = document.getElementById('reqDate');
            const option = timeSelect.options[timeSelect.selectedIndex];
            if (!option) return;
            const iso = option.getAttribute('data-date');
            if (!iso) return;
            if (dateInput.value !== iso) {
                dateInput.value = iso;
                dateInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        // Pre-fill from query params if coming from Faculty Availability
        function prefillFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const faculty = params.get('faculty');
            const date = params.get('date') || params.get('day');
            const time = params.get('time');

            if (faculty) {
                const deptSelect = document.getElementById('reqDepartment');
                const facultySelect = document.getElementById('reqFaculty');
                onDepartmentChange();
                // Make sure the requested faculty is selectable even if the
                // department list has not been populated for it yet.
                if (facultySelect.value !== faculty) {
                    const hasOption = Array.from(facultySelect.options).some(o => o.value === faculty);
                    if (!hasOption) {
                        const opt = document.createElement('option');
                        opt.value = faculty;
                        opt.textContent = faculty;
                        facultySelect.appendChild(opt);
                    }
                    facultySelect.value = faculty;
                }
                onFacultyChange();
            }

            if (time) {
                const timeSelect = document.getElementById('reqTime');
                if (timeSelect.disabled) {
                    const opt = document.createElement('option');
                    opt.value = time;
                    opt.textContent = time;
                    timeSelect.appendChild(opt);
                    timeSelect.disabled = false;
                }
                timeSelect.value = time;
                syncDateToTime();
            }

            if (date) document.getElementById('reqDate').value = date;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('reqFaculty').addEventListener('change', onFacultyChange);
            document.getElementById('reqTime').addEventListener('change', syncDateToTime);
            prefillFromQuery();
            renderMyRequests();
        });
    </script>
</body>
</html>
