<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | CONSULT-TRAK</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/student.css">
</head>
<body data-role="student">
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-user">
                <div class="user-info">
                    <div class="role">Juan Dela Cruz</div>
                    <div class="dept">BS Information Technology</div>
                </div>
                <button class="notification-bell" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="badge">3</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="label" id="themeLabel">Light</span>
                    <div class="switch"><div class="knob"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">JDC</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Juan Dela Cruz</span>
                    <span class="sidebar-user-dept">BS Information Technology</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="faculty-availability.html" class="nav-item" data-page="faculty-availability">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></span>
                    <span class="nav-label">Faculty Availability</span>
                </a>
                <a href="my-requests.html" class="nav-item" data-page="my-requests">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
                    <span class="nav-label">My Requests</span>
                </a>
                <a href="appointments.html" class="nav-item" data-page="appointments">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
                    <span class="nav-label">Appointments</span>
                </a>
                <a href="history.html" class="nav-item" data-page="history">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v6h6"/><path d="M3.51 9a9 9 0 1 0 2.13-5.36"/><path d="M12 7v5l3 2"/></svg></span>
                    <span class="nav-label">History</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">My Consultation History</h2>
                <p class="page-subtitle">Review your past consultations (FR-010)</p>
            </div>

            <div class="filter-bar">
                <select id="statusFilter" class="form-select">
                    <option value="all">All</option>
                    <option value="completed">Completed</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="pending">Pending</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <div class="history-timeline" id="historyTimeline">
                <!-- Filled by JS -->
            </div>
        </main>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/student.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        function renderHistory() {
            const history = window.studentFunctions.getHistory();
            const filter = document.getElementById('statusFilter').value;
            const timeline = document.getElementById('historyTimeline');

            const filtered = filter === 'all' ? history : history.filter(h => h.status === filter);

            if (filtered.length === 0) {
                timeline.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v6h6"/><path d="M3.51 9a9 9 0 1 0 2.13-5.36"/><path d="M12 7v5l3 2"/></svg></div><div class="empty-state-title">No history found</div><div class="empty-state-text">No consultations match this filter. Try a different status.</div></div>`;
                return;
            }

            timeline.innerHTML = filtered.map(h => `
                <div class="history-item ${h.status}">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-md);">
                        <div>
                            <strong>${h.subject}</strong> <span class="stat-label">with ${h.faculty}</span>
                        </div>
                        <span class="status-badge ${h.status}">${h.status.charAt(0).toUpperCase() + h.status.slice(1)}</span>
                    </div>
                    <div class="appointment-details" style="margin: var(--space-sm) 0;">
                        <span class="meta-icon">${window.ctIcon('calendar', 14)} ${h.date}</span>
                        <span class="meta-icon">${window.ctIcon('clock', 14)} ${h.time}</span>
                        <span class="meta-icon">${window.ctIcon('clock', 14)} ${h.duration}</span>
                    </div>
                    <div class="activity-title" style="font-size: var(--font-size-sm);">${h.outcome}</div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('statusFilter').addEventListener('change', renderHistory);
            renderHistory();
        });
    </script>
</body>
</html>
