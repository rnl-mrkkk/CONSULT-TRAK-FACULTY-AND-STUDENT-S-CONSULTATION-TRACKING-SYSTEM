    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">JDC</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Juan Dela Cruz</span>
                    <span class="sidebar-user-dept">BS Information Technology</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>

            <div class="sidebar-footer">

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Faculty Availability</h2>
                <p class="page-subtitle">Available consultation slots to schedule a meeting (FR-007)</p>
            </div>

            <!-- Department Filter -->
            <div class="content-card" style="margin-bottom: var(--space-lg);">
                <div class="card-body" style="padding: var(--space-md) var(--space-lg);">
                    <div style="display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap;">
                        <label class="form-label filter-label" style="margin: 0;">Filter by Department:</label>
                        <select id="departmentFilter" class="form-select" style="max-width: 300px; margin: 0;" onchange="filterByDepartment()">
                            <option value="">Select a department</option>
                            <option value="SOCS">SOCS Department</option>
                            <option value="SBM">SBM Department</option>
                            <option value="SON">SON Department</option>
                        </select>
                        <span class="stat-label" id="totalSlotCount"></span>
                    </div>
                </div>
            </div>

            <!-- Department Sections -->
            <div id="departmentSections">
                <!-- Filled by JS -->
            </div>
        </main>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/student.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        let currentFilter = '';

        function filterByDepartment() {
            currentFilter = document.getElementById('departmentFilter').value;
            renderAvailability();
        }

        function toggleDepartment(deptCode) {
            const content = document.getElementById(`dept-${deptCode}-content`);
            const icon = document.getElementById(`dept-${deptCode}-icon`);

            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.innerHTML = window.ctIcon('chevronDown', 14);
            } else {
                content.style.display = 'none';
                icon.innerHTML = window.ctIcon('chevronRight', 14);
            }
        }

        function renderAvailability() {
            const allSlots = window.studentFunctions.getFacultyAvailability();
            const departments = window.studentData.departments;
            const container = document.getElementById('departmentSections');

            // Group slots by department
            const slotsByDept = {};
            departments.forEach(dept => {
                slotsByDept[dept.code] = allSlots.filter(s => s.department === dept.code);
            });

            // Update total count
            const totalSlots = currentFilter
                ? (slotsByDept[currentFilter] || []).length
                : allSlots.length;
            document.getElementById('totalSlotCount').textContent = `${totalSlots} slot(s) available`;

            // Render department sections
            let html = '';
            departments.forEach(dept => {
                // Skip if filtered and not the selected department
                if (currentFilter && currentFilter !== dept.code) {
                    return;
                }

                const deptSlots = slotsByDept[dept.code] || [];
                const slotCount = deptSlots.length;

                html += `
                    <div class="content-card" style="margin-bottom: var(--space-lg);">
                        <div class="card-header" style="cursor: pointer; user-select: none;" onclick="toggleDepartment('${dept.code}')">
                            <div style="display: flex; align-items: center; gap: var(--space-sm);">
                                <span id="dept-${dept.code}-icon" class="department-toggle-icon">${window.ctIcon('chevronDown', 14)}</span>
                                <h3 class="card-title">${dept.name}</h3>
                            </div>
                            <span class="stat-label">${slotCount} faculty member(s)</span>
                        </div>
                        <div class="card-body" id="dept-${dept.code}-content" style="display: block;">
                `;

                if (deptSlots.length === 0) {
                    html += `
                        <div class="empty-state">
                            <div class="empty-state-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                            <div class="empty-state-title">No faculty available yet</div>
                            <div class="empty-state-text">This department will have faculty consultation slots soon.</div>
                        </div>
                    `;
                } else {
                    deptSlots.forEach(s => {
                        html += `
                            <div class="availability-row">
                                <div>
                                    <div class="availability-faculty">${s.displayName}</div>
                                    <div class="availability-detail">${s.fullDepartment}</div>
                                </div>
                                <div>
                                    <div class="availability-detail">${s.day}</div>
                                    <div class="availability-detail">${s.time}</div>
                                </div>
                                <div>
                                    <div class="stat-label">${s.slots} slot(s) open</div>
                                    <button class="book-slot-btn" onclick="bookSlot(${s.id}, '${s.displayName.replace(/'/g, "\\'")}', '${s.day}', '${s.time}')">Book Slot</button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function bookSlot(id, faculty, day, time) {
            if (confirm(`Book a consultation with ${faculty} on ${day} (${time})?`)) {
                // Redirect to request form with data pre-selected via query params
                const params = new URLSearchParams({ faculty, day, time });
                window.location.href = 'my-requests.html?' + params.toString();
            }
        }

        document.addEventListener('DOMContentLoaded', renderAvailability);
    </script>
</body>
</html>
