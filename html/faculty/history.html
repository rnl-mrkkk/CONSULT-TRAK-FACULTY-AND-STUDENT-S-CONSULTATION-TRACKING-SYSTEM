<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | CONSULT-TRAK</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/faculty.css">
</head>
<body data-role="faculty">
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-user">
                <div class="user-info">
                    <div class="role">Faculty Member</div>
                    <div class="dept">Computer Science</div>
                </div>
                <button class="notification-bell" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="badge">3</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="label" id="themeLabel">Light</span>
                    <div class="switch"><div class="knob"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">FM</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Faculty Member</span>
                    <span class="sidebar-user-dept">Computer Science</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="consultation-requests.html" class="nav-item" data-page="consultation-requests">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
                    <span class="nav-label">Consultation Requests</span>
                </a>
                <a href="availability.html" class="nav-item" data-page="availability">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></span>
                    <span class="nav-label">Availability</span>
                </a>
                <a href="consultation-records.html" class="nav-item" data-page="consultation-records">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
                    <span class="nav-label">Consultation Records</span>
                </a>
                <a href="history.html" class="nav-item" data-page="history">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v6h6"/><path d="M3.51 9a9 9 0 1 0 2.13-5.36"/><path d="M12 7v5l3 2"/></svg></span>
                    <span class="nav-label">History</span>
                </a>

                <a href="reports.html" class="nav-item" data-page="reports">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/></svg></span>
                    <span class="nav-label">Reports</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Consultation History</h2>
                <p class="page-subtitle">Consultations across all statuses (FR-010)</p>
            </div>

            <div class="filter-bar">
                <input type="text" id="searchInput" class="form-input" placeholder="Search student, subject, or keyword...">
                <select id="statusFilter" class="form-select">
                    <option value="all">All Status</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="rejected">Rejected</option>
                </select>
                <label class="form-label filter-label" style="margin: 0;">From</label>
                <input type="date" id="dateFromFilter" class="form-input">
                <label class="form-label filter-label" style="margin: 0;">To</label>
                <input type="date" id="dateToFilter" class="form-input">
                <button class="action-btn secondary" onclick="resetHistoryFilters()">Reset</button>
                <button class="action-btn primary" onclick="exportHistoryCSV()">Export CSV</button>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h3 class="card-title">All Consultations</h3>
                    <span class="stat-label" id="historyCount"></span>
                </div>
                <div class="card-body no-padding">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Subject</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <!-- Filled by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/faculty.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        function currentHistoryFilters() {
            return {
                search: document.getElementById('searchInput').value,
                status: document.getElementById('statusFilter').value,
                dateFrom: document.getElementById('dateFromFilter').value,
                dateTo: document.getElementById('dateToFilter').value
            };
        }

        function renderHistory() {
            const filtered = window.facultyFunctions.getSearchableHistory(currentHistoryFilters());
            document.getElementById('historyCount').textContent = filtered.length + ' consultation(s)';

            const tbody = document.getElementById('historyBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <div class="empty-state-icon">${window.ctIcon('note', 40)}</div>
                                <div class="empty-state-title">No consultations found</div>
                                <div class="empty-state-text">Try a different status, date range, or search term.</div>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(c => `
                <tr>
                    <td>${escapeHtml(c.student)}</td>
                    <td>${escapeHtml(c.subject)}</td>
                    <td>${escapeHtml(c.date || '—')}</td>
                    <td>${escapeHtml(c.time || '—')}</td>
                    <td><span class="status-badge ${escapeHtml(c.status)}">${escapeHtml(c.status.charAt(0).toUpperCase() + c.status.slice(1))}</span></td>
                    <td>${escapeHtml(c.detail) || '—'}</td>
                </tr>
            `).join('');
        }

        function resetHistoryFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('dateFromFilter').value = '';
            document.getElementById('dateToFilter').value = '';
            renderHistory();
        }

        function exportHistoryCSV() {
            const rows = window.facultyFunctions.getSearchableHistory(currentHistoryFilters());
            if (rows.length === 0) {
                alert('No consultations match the current filters, so there is nothing to export.');
                return;
            }
            window.facultyFunctions.downloadCSV('my-consultation-history.csv', window.facultyFunctions.toCSV({ rows: rows }));
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('statusFilter').addEventListener('change', renderHistory);
            document.getElementById('searchInput').addEventListener('input', renderHistory);
            document.getElementById('dateFromFilter').addEventListener('change', renderHistory);
            document.getElementById('dateToFilter').addEventListener('change', renderHistory);
            renderHistory();
        });
    </script>
</body>
</html>
