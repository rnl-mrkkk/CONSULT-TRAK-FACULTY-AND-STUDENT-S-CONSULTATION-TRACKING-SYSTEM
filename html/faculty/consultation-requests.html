<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Requests | CONSULT-TRAK</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/faculty.css">
</head>
<body data-role="faculty">
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-user">
                <div class="user-info">
                    <div class="role">Faculty Member</div>
                    <div class="dept">Computer Science</div>
                </div>
                <button class="notification-bell" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="badge">3</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="label" id="themeLabel">Light</span>
                    <div class="switch"><div class="knob"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">FM</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Faculty Member</span>
                    <span class="sidebar-user-dept">Computer Science</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="consultation-requests.html" class="nav-item" data-page="consultation-requests">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
                    <span class="nav-label">Consultation Requests</span>
                </a>
                <a href="availability.html" class="nav-item" data-page="availability">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></span>
                    <span class="nav-label">Availability</span>
                </a>
                <a href="consultation-records.html" class="nav-item" data-page="consultation-records">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg></span>
                    <span class="nav-label">Consultation Records</span>
                </a>
                <a href="history.html" class="nav-item" data-page="history">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v6h6"/><path d="M3.51 9a9 9 0 1 0 2.13-5.36"/><path d="M12 7v5l3 2"/></svg></span>
                    <span class="nav-label">History</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Consultation Requests</h2>
                <p class="page-subtitle">View, accept, or reject student consultation requests (FR-004)</p>
            </div>

            <div id="requestsList">
                <!-- Filled by JS -->
            </div>
        </main>
    </div>

    <!-- Reject Modal -->
    <div id="rejectModal" class="modal-overlay" hidden>
        <div class="modal">
            <div class="modal-header">
                <h3>Reject Request</h3>
                <button class="modal-close" onclick="closeRejectModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="rejectRequestId">
                <div class="form-group">
                    <label class="form-label">Reason for Rejection</label>
                    <textarea id="rejectReason" class="form-textarea" placeholder="Explain why this request is being rejected..."></textarea>
                </div>
                <div class="modal-actions">
                    <button class="action-btn secondary" onclick="closeRejectModal()">Cancel</button>
                    <button class="action-btn danger" onclick="confirmReject()">Reject Request</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/faculty.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        let requests = [];

        function renderRequests() {
            const list = document.getElementById('requestsList');
            requests = window.facultyFunctions.getAllRequests();

            if (requests.length === 0) {
                list.innerHTML = `<div class="empty-state">
                    <div class="empty-state-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>
                    <div class="empty-state-title">No requests</div>
                    <div class="empty-state-text">There are no consultation requests right now.</div>
                </div>`;
                return;
            }

            list.innerHTML = requests.map(r => `
                <div class="request-card">
                    <div class="request-header">
                        <div>
                            <div class="request-student">${r.student} <span class="stat-label">(${r.studentId})</span></div>
                            <div class="request-subject">${r.subject} · Sent ${r.submittedAt}</div>
                        </div>
                        <span class="status-badge ${r.status}">${r.status.charAt(0).toUpperCase() + r.status.slice(1)}</span>
                    </div>
                    <div class="request-concern">"${r.concern}"</div>
                    <div class="request-meta">
                        <span class="meta-icon">${window.ctIcon('calendar', 14)} ${r.preferredDate}</span>
                        <span class="meta-icon">${window.ctIcon('clock', 14)} ${r.preferredTime}</span>
                        <span class="meta-icon">${window.ctIcon('mail', 14)} ${r.email}</span>
                    </div>
                    ${r.status === 'rejected' && r.rejectionReason ? `<div class="request-meta"><span style="color: var(--color-error);">Rejected: ${r.rejectionReason}</span></div>` : ''}
                    ${r.status === 'pending' ? `
                    <div class="request-actions">
                        <button class="action-btn success" onclick="handleAccept(${r.id})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Accept</button>
                        <button class="action-btn danger" onclick="openRejectModal(${r.id})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg> Reject</button>
                    </div>` : ''}
                </div>
            `).join('');
        }

        function handleAccept(id) {
            if (window.facultyFunctions.acceptRequest(id)) {
                alert('Request accepted. The student will be notified.');
                renderRequests();
            }
        }

        function openRejectModal(id) {
            document.getElementById('rejectRequestId').value = id;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectModal').hidden = false;
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').hidden = true;
        }

        function confirmReject() {
            const id = parseInt(document.getElementById('rejectRequestId').value);
            const reason = document.getElementById('rejectReason').value.trim() || 'No reason provided';
            if (window.facultyFunctions.rejectRequest(id, reason)) {
                closeRejectModal();
                renderRequests();
            }
        }

        document.addEventListener('DOMContentLoaded', renderRequests);
    </script>
</body>
</html>
