    <div class="dashboard-container">
        <aside class="sidebar">

            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">FM</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Faculty Member</span>
                    <span class="sidebar-user-dept">Computer Science</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>

                <a href="consultation-requests.html" class="nav-item" data-page="consultation-requests">

                    <span class="nav-label">Consultation Requests</span>
                </a>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Consultation Availability</h2>
                <p class="page-subtitle">Set and manage your consultation time slots (FR-007)</p>
            </div>

            <div class="content-card" style="margin-bottom: var(--space-xl);">
                <div class="card-header">
                    <h3 class="card-title">Add New Availability Slot</h3>
                </div>
                <div class="card-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Day</label>
                            <select id="newSlotDay" class="form-select">
                                <option>Monday</option>
                                <option>Tuesday</option>
                                <option>Wednesday</option>
                                <option>Thursday</option>
                                <option>Friday</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Start Time</label>
                            <input type="time" id="newSlotStart" class="form-input" placeholder="09:00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">End Time</label>
                            <input type="time" id="newSlotEnd" class="form-input" placeholder="12:00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Max Students</label>
                            <input type="number" id="newSlotMax" class="form-input" value="5" min="1">
                        </div>
                    </div>
                    <button class="action-btn primary" onclick="addSlot()">+ Add Slot</button>
                </div>
            </div>

            <div class="availability-grid" id="availabilityGrid">
                <!-- Filled by JS -->
            </div>
        </main>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/faculty.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        function formatTime(t) {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            const period = h >= 12 ? 'PM' : 'AM';
            const hour = ((h + 11) % 12) + 1;
            return `${hour}:${m.toString().padStart(2, '0')} ${period}`;
        }

        function renderAvailability() {
            const slots = window.facultyFunctions.getAvailability();
            const grid = document.getElementById('availabilityGrid');

            if (slots.length === 0) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></div><div class="empty-state-title">No availability set</div><div class="empty-state-text">Add your consultation slots above.</div></div>`;
                return;
            }

            grid.innerHTML = slots.map(s => `
                <div class="availability-card ${s.available ? '' : 'disabled'}">
                    <div class="availability-header">
                        <div>
                            <div class="availability-day">${s.day}</div>
                            <div class="availability-time">${s.startTime} — ${s.endTime}</div>
                        </div>
                        <span class="status-badge ${s.available ? 'available' : 'inactive'}">${s.available ? 'Active' : 'Disabled'}</span>
                    </div>
                    <div class="availability-toggle">
                        <button class="action-btn ${s.available ? 'secondary' : 'success'} sm" onclick="toggleSlot(${s.id})">${s.available ? 'Disable' : 'Enable'}</button>
                        <button class="action-btn danger sm" onclick="removeSlot(${s.id})">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function addSlot() {
            const day = document.getElementById('newSlotDay').value;
            const start = document.getElementById('newSlotStart').value;
            const end = document.getElementById('newSlotEnd').value;
            const max = parseInt(document.getElementById('newSlotMax').value) || 5;

            if (!start || !end) {
                alert('Please set both start and end times.');
                return;
            }

            const newId = window.facultyFunctions.addAvailabilitySlot({
                day,
                startTime: formatTime(start),
                endTime: formatTime(end),
                maxStudents: max,
                available: true
            });

            if (newId) {
                document.getElementById('newSlotStart').value = '';
                document.getElementById('newSlotEnd').value = '';
                renderAvailability();
            }
        }

        function toggleSlot(id) {
            const slot = window.facultyFunctions.getAvailability().find(s => s.id === id);
            if (slot) {
                window.facultyFunctions.updateAvailability(id, { available: !slot.available });
                renderAvailability();
            }
        }

        function removeSlot(id) {
            if (confirm('Remove this availability slot?')) {
                window.facultyFunctions.removeAvailabilitySlot(id);
                renderAvailability();
            }
        }

        document.addEventListener('DOMContentLoaded', renderAvailability);
    </script>
</body>
</html>
