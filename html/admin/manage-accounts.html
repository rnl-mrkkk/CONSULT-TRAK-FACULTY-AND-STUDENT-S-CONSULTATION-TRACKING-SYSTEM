<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Accounts | CONSULT-TRAK</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body data-role="admin">
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-user">
                <div class="user-info">
                    <div class="role">Administrator</div>
                    <div class="dept">System Admin</div>
                </div>
                <button class="notification-bell" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="badge">3</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="label" id="themeLabel">Light</span>
                    <div class="switch"><div class="knob"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">AD</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Administrator</span>
                    <span class="sidebar-user-dept">System Admin</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="manage-accounts.html" class="nav-item" data-page="manage-accounts">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    <span class="nav-label">Manage Accounts</span>
                </a>
                <a href="consultation-records.html" class="nav-item" data-page="consultation-records">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h2M3 12h2M3 18h2"/></svg></span>
                    <span class="nav-label">Consultation Records</span>
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-9"/></svg></span>
                    <span class="nav-label">Reports</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Manage Accounts</h2>
                <p class="page-subtitle">Create and manage student and faculty accounts</p>
            </div>

            <!-- Filter Bar -->
            <div id="accountError" class="alert alert-error" style="display: none; margin-bottom: var(--space-lg);" role="alert"></div>

            <div class="filter-bar">
                <input type="text" id="searchInput" class="form-input" placeholder="Search by name or email...">
                <select id="roleFilter" class="form-select">
                    <option value="all">All Roles</option>
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="admin">Admin</option>
                </select>
                <select id="statusFilter" class="form-select">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
                <button class="action-btn primary" onclick="openAddModal()">+ Add Account</button>
            </div>

            <!-- Accounts Table -->
            <div class="content-card">
                <div class="card-header">
                    <h3 class="card-title">Accounts (FR-001)</h3>
                    <span class="stat-label" id="accountCount"></span>
                </div>
                <div class="card-body no-padding">
                    <div id="accountsSections">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Account Modal -->
    <div id="accountModal" class="modal-overlay" hidden>
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Account</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editAccountId">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="accountName" class="form-input" placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="accountEmail" class="form-input" placeholder="Enter email">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <select id="accountRole" class="form-select">
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <input type="text" id="accountDepartment" class="form-input" placeholder="Enter department">
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="action-btn secondary" onclick="closeAddModal()">Cancel</button>
                    <button class="action-btn primary" onclick="saveAccount()">Save Account</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        let accounts = [];

        // Accounts are grouped into one section per role so a faculty login is
        // never listed alongside students. "All Roles" shows every section.
        const ROLE_SECTIONS = [
            { role: 'faculty', title: 'Faculty Accounts', icon: 'users' },
            { role: 'student', title: 'Student Accounts', icon: 'user' },
            { role: 'admin', title: 'Admin Accounts', icon: 'shield' }
        ];

        function accountRow(a) {
            return `
                <tr>
                    <td>${escapeHtml(a.name)}${a.studentId ? `<div class="availability-detail">${escapeHtml(a.studentId)}</div>` : ''}</td>
                    <td>${escapeHtml(a.email)}</td>
                    <td>${escapeHtml(a.department)}</td>
                    <td><span class="status-badge ${a.status === 'active' ? 'active' : 'inactive'}">${escapeHtml(a.status.charAt(0).toUpperCase() + a.status.slice(1))}</span></td>
                    <td>
                        <div class="admin-table-actions">
                            <button class="action-btn secondary sm" onclick="editAccount(${a.id})">Edit</button>
                            <button class="action-btn ${a.status === 'active' ? 'danger' : 'success'} sm" onclick="toggleStatus(${a.id})">${a.status === 'active' ? 'Deactivate' : 'Activate'}</button>
                            <button class="action-btn danger sm" onclick="deleteAccount(${a.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderAccounts(filtered) {
            const container = document.getElementById('accountsSections');
            const list = filtered || accounts;
            document.getElementById('accountCount').textContent = list.length + ' account(s)';

            const selectedRole = document.getElementById('roleFilter').value;
            const sections = ROLE_SECTIONS.filter(s => selectedRole === 'all' || s.role === selectedRole)
                .filter(s => list.some(a => a.role === s.role));

            if (sections.length === 0) {
                container.innerHTML = `
                    <div class="account-empty">
                        <div class="empty-state-icon">${window.ctIcon('user', 40)}</div>
                        <div class="empty-state-title">No accounts found</div>
                        <div class="empty-state-text">Try changing the filters, or add a new account.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = sections.map(section => {
                const rows = list.filter(a => a.role === section.role);
                return `
                    <section class="account-section" data-role="${escapeHtml(section.role)}">
                        <div class="account-section-header">
                            <span class="account-section-icon">${window.ctIcon(section.icon, 16)}</span>
                            <h4 class="account-section-title">${escapeHtml(section.title)}</h4>
                            <span class="account-section-count">${rows.length}</span>
                        </div>
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Department</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>${rows.map(accountRow).join('')}</tbody>
                        </table>
                    </section>
                `;
            }).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const role = document.getElementById('roleFilter').value;
            const status = document.getElementById('statusFilter').value;
            const filtered = accounts.filter(a => {
                const matchSearch = a.name.toLowerCase().includes(search) || a.email.toLowerCase().includes(search);
                const matchRole = role === 'all' || a.role === role;
                const matchStatus = status === 'all' || a.status === status;
                return matchSearch && matchRole && matchStatus;
            });
            renderAccounts(filtered);
        }

        function openAddModal() {
            document.getElementById('editAccountId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Account';
            document.getElementById('accountName').value = '';
            document.getElementById('accountEmail').value = '';
            document.getElementById('accountRole').value = 'student';
            document.getElementById('accountDepartment').value = '';
            document.getElementById('accountModal').hidden = false;
        }

        function editAccount(id) {
            const account = accounts.find(a => a.id === id);
            if (!account) return;
            document.getElementById('editAccountId').value = id;
            document.getElementById('modalTitle').textContent = 'Edit Account';
            document.getElementById('accountName').value = account.name;
            document.getElementById('accountEmail').value = account.email;
            document.getElementById('accountRole').value = account.role;
            document.getElementById('accountDepartment').value = account.department;
            document.getElementById('accountModal').hidden = false;
        }

        function closeAddModal() {
            document.getElementById('accountModal').hidden = true;
        }

        function showAccountError(message) {
            const box = document.getElementById('accountError');
            box.textContent = message;
            box.style.display = 'block';
        }

        function clearAccountError() {
            const box = document.getElementById('accountError');
            box.textContent = '';
            box.style.display = 'none';
        }

        function saveAccount() {
            clearAccountError();
            const id = document.getElementById('editAccountId').value;
            const name = document.getElementById('accountName').value.trim();
            const email = document.getElementById('accountEmail').value.trim();
            const role = document.getElementById('accountRole').value;
            const department = document.getElementById('accountDepartment').value.trim();

            if (!name || !email || !department) {
                showAccountError('Please fill in all fields.');
                return;
            }

            if (id) {
                const result = window.adminFunctions.updateAccount(parseInt(id, 10), { name, email, role, department });
                if (result && result.error) {
                    showAccountError(result.error);
                    return;
                }
            } else {
                const newId = window.adminFunctions.addAccount({ name, email, role, department });
                if (newId && newId.error) {
                    showAccountError(newId.error);
                    return;
                }
            }

            // Re-read from the store so the table reflects what was persisted
            accounts = window.adminFunctions.getAccountData();
            closeAddModal();
            applyFilters();
        }

        function toggleStatus(id) {
            clearAccountError();
            const account = window.adminFunctions.toggleAccountStatus(id);
            if (!account) {
                showAccountError('Account not found.');
                return;
            }
            accounts = window.adminFunctions.getAccountData();
            applyFilters();
        }

        function deleteAccount(id) {
            clearAccountError();
            const account = accounts.find(a => a.id === id);
            if (!account) {
                showAccountError('Account not found.');
                return;
            }
            if (!confirm(`Delete ${account.name} (${account.email})? This cannot be undone.`)) {
                return;
            }
            const result = window.adminFunctions.deleteAccount(id);
            if (result && result.error) {
                showAccountError(result.error);
                return;
            }
            accounts = window.adminFunctions.getAccountData();
            applyFilters();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.requireRole || !window.requireRole('admin')) return;

            accounts = window.adminFunctions.getAccountData();
            renderAccounts();
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('roleFilter').addEventListener('change', applyFilters);
            document.getElementById('statusFilter').addEventListener('change', applyFilters);
        });
    </script>
</body>
</html>
