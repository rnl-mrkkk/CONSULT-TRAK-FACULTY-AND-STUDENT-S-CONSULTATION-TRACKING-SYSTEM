<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Records | CONSULT-TRAK</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body data-role="admin">
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-user">
                <div class="user-info">
                    <div class="role">Administrator</div>
                    <div class="dept">System Admin</div>
                </div>
                <button class="notification-bell" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="badge">3</span>
                </button>
                <div class="theme-toggle" onclick="toggleTheme()">
                    <span class="label" id="themeLabel">Light</span>
                    <div class="switch"><div class="knob"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <a href="dashboard.html" class="sidebar-brand">
                <span class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 10h18"/></svg></span>
                <h1 class="brand-name">CONSULT-TRAK</h1>
            </a>
            <div class="sidebar-user-card">
                <div class="sidebar-user-avatar">AD</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Administrator</span>
                    <span class="sidebar-user-dept">System Admin</span>
                </div>
                <svg class="sidebar-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v11h14V10"/></svg></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="manage-accounts.html" class="nav-item" data-page="manage-accounts">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    <span class="nav-label">Manage Accounts</span>
                </a>
                <a href="consultation-records.html" class="nav-item" data-page="consultation-records">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h2M3 12h2M3 18h2"/></svg></span>
                    <span class="nav-label">Consultation Records</span>
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-9"/></svg></span>
                    <span class="nav-label">Reports</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Consultation Records</h2>
                <p class="page-subtitle">View and monitor consultation records system-wide (FR-011)</p>
            </div>

            <div class="filter-bar">
                <input type="text" id="searchInput" class="form-input" placeholder="Search by student, faculty, or subject...">
                <select id="statusFilter" class="form-select">
                    <option value="all">All Status</option>
                    <option value="scheduled">Scheduled</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <div class="content-card">
                <div class="card-header">
                    <h3 class="card-title">All Consultation Records</h3>
                    <span class="stat-label" id="recordCount"></span>
                </div>
                <div class="card-body no-padding">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Faculty</th>
                                <th>Subject</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTableBody">
                            <!-- Filled by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/script.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute('data-theme') === 'dark';
            root.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeLabel').textContent = isDark ? 'Light' : 'Dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Load saved theme
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeLabel').textContent = savedTheme === 'dark' ? 'Dark' : 'Light';
            }
        });

        let records = [];

        function renderRecords(recordsToShow) {
            const tbody = document.getElementById('recordsTableBody');
            const list = recordsToShow || records;
            document.getElementById('recordCount').textContent = list.length + ' record(s)';

            tbody.innerHTML = list.map(c => `
                <tr>
                    <td>${c.student}</td>
                    <td>${c.faculty}</td>
                    <td>${c.subject}</td>
                    <td>${c.date}</td>
                    <td>${c.time}</td>
                    <td><span class="status-badge ${c.status}">${c.status.charAt(0).toUpperCase() + c.status.slice(1)}</span></td>
                    <td>${c.notes || '—'}</td>
                </tr>
            `).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const filtered = records.filter(c => {
                const matchSearch = c.student.toLowerCase().includes(search) ||
                                    c.faculty.toLowerCase().includes(search) ||
                                    c.subject.toLowerCase().includes(search);
                const matchStatus = status === 'all' || c.status === status;
                return matchSearch && matchStatus;
            });
            renderRecords(filtered);
        }

        window.addEventListener('load', () => {
            records = window.adminFunctions.getConsultationData();
            renderRecords();
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('statusFilter').addEventListener('change', applyFilters);
        });
    </script>
</body>
</html>
